<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chirp — What's happening?</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #000;
  color: #e7e9ea;
  font-family: Arial, sans-serif;
}
.app {
  display: grid;
  grid-template-columns: 230px minmax(0, 600px) 300px;
  max-width: 1200px;
  margin: auto;
  min-height: 100vh;
}
nav {
  padding: 24px 18px;
  border-right: 1px solid #2f3336;
}
.logo { color: #1d9bf0; font-size: 30px; font-weight: bold; }
.nav-item {
  display: block;
  padding: 14px 10px;
  margin: 6px 0;
  color: #e7e9ea;
  text-decoration: none;
  font-size: 18px;
  border-radius: 25px;
  cursor: pointer;
}
.nav-item:hover { background: #181818; }
.post-btn {
  border: 0;
  background: #1d9bf0;
  color: white;
  border-radius: 25px;
  padding: 14px;
  width: 100%;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
main { border-right: 1px solid #2f3336; min-width: 0; }
header {
  padding: 20px;
  font-size: 21px;
  font-weight: bold;
  border-bottom: 1px solid #2f3336;
  position: sticky;
  top: 0;
  background: rgba(0,0,0,.9);
  backdrop-filter: blur(10px);
}
.composer { padding: 18px; border-bottom: 8px solid #202327; }
textarea {
  width: 100%;
  min-height: 75px;
  background: transparent;
  color: white;
  border: none;
  resize: vertical;
  outline: none;
  font-size: 18px;
}
.composer-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.hint { color: #71767b; font-size: 13px; }
.feed-post {
  padding: 18px;
  border-bottom: 1px solid #2f3336;
  display: flex;
  gap: 12px;
}
.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #263d50;
  font-size: 22px;
  flex-shrink: 0;
}
.post-content { flex: 1; min-width: 0; }
.post-meta { color: #71767b; font-size: 14px; margin-bottom: 9px; }
.post-meta strong { color: #e7e9ea; font-size: 15px; }
.post-text { line-height: 1.5; overflow-wrap: anywhere; }
.actions {
  display: flex;
  justify-content: space-between;
  margin-top: 16px;
  max-width: 400px;
}
.action {
  color: #71767b;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  padding: 5px;
}
.action:hover { color: #1d9bf0; }
.action.liked { color: #f91880; }
aside { padding: 18px; }
.search {
  width: 100%;
  border: 1px solid #2f3336;
  background: #16181c;
  color: white;
  border-radius: 25px;
  padding: 14px;
  outline: none;
}
.trends {
  background: #16181c;
  border-radius: 16px;
  margin-top: 20px;
  padding: 18px;
}
.trends h3 { margin-top: 0; }
.trend { padding: 13px 0; border-bottom: 1px solid #2f3336; }
.trend:last-child { border: 0; }
.trend small { color: #71767b; }
.empty { padding: 40px 20px; text-align: center; color: #71767b; }
@media(max-width: 950px) {
  .app { grid-template-columns: 75px minmax(0,600px); justify-content: center; }
  nav { padding: 20px 10px; }
  .nav-label, .post-btn-label { display: none; }
  .nav-item { text-align: center; font-size: 22px; }
  .post-btn { padding: 14px 0; }
  aside { display: none; }
}
@media(max-width: 500px) {
  .app { display: block; padding-bottom: 60px; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 58px; z-index: 5; background: #000;
    border-top: 1px solid #2f3336; border-right: 0;
    display: flex; justify-content: space-around; align-items: center;
    padding: 0 8px;
  }
  .logo, nav .nav-item:nth-of-type(n+4), nav .post-btn { display: none; }
  .nav-item { margin: 0; padding: 10px; }
  main { border-right: 0; }
}
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="logo">𝕏</div>
    <a class="nav-item" href="#" onclick="showAll()">🏠 <span class="nav-label">Home</span></a>
    <a class="nav-item" href="#search">🔍 <span class="nav-label">Explore</span></a>
    <a class="nav-item" href="#" onclick="showAll()">🔔 <span class="nav-label">Notifications</span></a>
    <a class="nav-item" href="#profile">👤 <span class="nav-label">Profile</span></a>
    <button class="post-btn" onclick="document.getElementById('postInput').focus()">✏️ <span class="post-btn-label">Post</span></button>
  </nav>

  <main>
    <header>Home</header>
    <section class="composer">
      <textarea id="postInput" maxlength="280" placeholder="What's happening?!"></textarea>
      <div class="composer-bottom">
        <span class="hint" id="charCount">0 / 280</span>
        <button class="post-btn" style="width:auto;padding:10px 24px" onclick="publishPost()">Post</button>
      </div>
    </section>
    <section id="feed"></section>
  </main>

  <aside id="search">
    <input class="search" id="searchInput" placeholder="🔍 Search Chirp..." oninput="renderFeed()">
    <div class="trends">
      <h3>What's happening</h3>
      <div class="trend"><small>Technology · Trending</small><br><strong>#AI</strong></div>
      <div class="trend"><small>Trending</small><br><strong>#Gaming</strong></div>
      <div class="trend"><small>Technology · Trending</small><br><strong>#WebDevelopment</strong></div>
      <div class="trend"><small>Trending</small><br><strong>#Chirp</strong></div>
    </div>
  </aside>
</div>

<script>
const initialPosts = [
  {id:1,name:"Alex Morgan",handle:"alexm",avatar:"😎",text:"Just built my own social media website 🔥 What do you guys think?",likes:24,reposts:8,comments:3,liked:false,time:"now"},
  {id:2,name:"Sarah Chen",handle:"sarahcodes",avatar:"👩🏻‍💻",text:"Reminder: you don't have to be perfect. You just have to start. 💙",likes:102,reposts:31,comments:12,liked:false,time:"5m"},
  {id:3,name:"Jordan Lee",handle:"jlee",avatar:"🚀",text:"HTML + CSS + JavaScript = endless possibilities. Keep building!",likes:56,reposts:14,comments:6,liked:false,time:"12m"}
];

let posts = JSON.parse(localStorage.getItem("chirp-posts") || "null") || initialPosts;
let nextId = Math.max(0, ...posts.map(p => p.id)) + 1;

const feed = document.getElementById("feed");
const input = document.getElementById("postInput");

input.addEventListener("input", () => {
  document.getElementById("charCount").textContent = input.value.length + " / 280";
});

function save() {
  localStorage.setItem("chirp-posts", JSON.stringify(posts));
}

function publishPost() {
  const text = input.value.trim();
  if (!text) {
    input.focus();
    return;
  }
  posts.unshift({
    id: nextId++,
    name: "You",
    handle: "you",
    avatar: "😎",
    text,
    likes: 0,
    reposts: 0,
    comments: 0,
    liked: false,
    time: "now"
  });
  input.value = "";
  document.getElementById("charCount").textContent = "0 / 280";
  save();
  renderFeed();
}

function toggleLike(id) {
  posts = posts.map(p => p.id === id
    ? {...p, liked: !p.liked, likes: p.likes + (p.liked ? -1 : 1)}
    : p);
  save();
  renderFeed();
}

function repost(id) {
  posts = posts.map(p => p.id === id ? {...p, reposts:p.reposts+1} : p);
  save();
  renderFeed();
}

function renderFeed() {
  const query = (document.getElementById("searchInput")?.value || "").toLowerCase();
  const filtered = posts.filter(p =>
    (p.text + p.name + p.handle).toLowerCase().includes(query)
  );

  if (!filtered.length) {
    feed.innerHTML = '<div class="empty">No posts found. Try another search!</div>';
    return;
  }

  feed.innerHTML = filtered.map(p => `
    <article class="feed-post">
      <div class="avatar">${escapeHTML(p.avatar)}</div>
      <div class="post-content">
        <div class="post-meta"><strong>${escapeHTML(p.name)}</strong> @${escapeHTML(p.handle)} · ${escapeHTML(p.time)}</div>
        <div class="post-text">${escapeHTML(p.text).replace(/\n/g,"<br>")}</div>
        <div class="actions">
          <button class="action" onclick="commentPost(${p.id})">💬 ${p.comments}</button>
          <button class="action" onclick="repost(${p.id})">🔁 ${p.reposts}</button>
          <button class="action ${p.liked ? "liked" : ""}" onclick="toggleLike(${p.id})">${p.liked ? "♥" : "♡"} ${p.likes}</button>
          <button class="action" onclick="sharePost(${p.id})">↗ Share</button>
        </div>
      </div>
    </article>
  `).join("");
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

function commentPost(id) {
  const comment = prompt("Write a comment:");
  if (comment && comment.trim()) {
    posts = posts.map(p => p.id === id ? {...p, comments:p.comments+1} : p);
    save();
    renderFeed();
    alert("Comment added! (Demo only)");
  }
}

function sharePost(id) {
  const p = posts.find(p => p.id === id);
  if (p && navigator.clipboard) {
    navigator.clipboard.writeText(p.text)
      .then(() => alert("Post copied!"))
      .catch(() => alert(p.text));
  } else if (p) alert(p.text);
}

function showAll() {
  document.getElementById("searchInput").value = "";
  renderFeed();
}

renderFeed();
</script>
</body>
</html>
